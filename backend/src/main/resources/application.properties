spring.application.name=api
server.port=8080
# PostgreSQL configuration. Environment variables keep connection details out of source.
# The default values match docker-compose.yml and are suitable for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/bankofcaptcha}
spring.datasource.username=${DB_USERNAME:bankapp}
spring.datasource.password=${DB_PASSWORD:bankapp_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JWT Secret (just a dummy for prototype)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Development-only wrapping secret for PQC private key material. Set PQC_MASTER_KEY in every
# non-demo environment and store the secret in a KMS/HSM there.
app.pqc.master-key=${PQC_MASTER_KEY:bankofcaptcha-local-dev-master-key-change-before-deployment}

# Shared only with the local AI module. AI integrations send this value in X-AI-Service-Key.
app.ai.service-key=${AI_SERVICE_KEY:bankofcaptcha-local-ai-service-key-change-before-deployment}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}