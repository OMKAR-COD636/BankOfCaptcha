services:
  postgres:
    image: postgres:16-alpine
    container_name: bankofcaptcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankofcaptcha
      POSTGRES_USER: bankapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankapp_dev_password}
    ports:
      # Use 5433 on the host to avoid colliding with an existing local PostgreSQL service.
      # PostgreSQL still listens on its standard 5432 port inside the container.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bankofcaptcha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankapp -d bankofcaptcha"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bankofcaptcha_postgres_data:
